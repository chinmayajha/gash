name: Attribution

# Every commit in a PR must say which models helped write it, with an
# "Assisted-By: <model and version>" or "Co-Authored-By: <model and version> <noreply@vendor>"
# trailer per model, or "Assisted-By: none" when no model was used.
# See .github/scripts/check-attribution.sh.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  attribution:
    name: Model attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-attribution.sh "$BASE_SHA" "$HEAD_SHA"
